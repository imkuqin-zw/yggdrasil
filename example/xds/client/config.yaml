# xDS Example Configuration for Client

yggdrasil:
  application:
    name: "yggdrasil.example.xds.client"
    version: "1.0.0"

  # Client configuration
  client:
    yggdrasil.example.xds.server:
      resolver: "xds"
      balancer: "xds"

  # Logging
  logger:
    level: "info"

# xDS configuration
xds:
  server:
    address: "localhost:15010"
    useTLS: false

  node:
    cluster: "yggdrasil.example.xds.client"
    id: "yggdrasil.example.xds.client.1"
    buildVersion: "1.19.0"

  resources:
    cds: true
    eds: true

  timeout: 10s
  retryInterval: 5s
  maxRetries: 3
  useADS: true