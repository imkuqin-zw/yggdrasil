yggdrasil:
  application:
    name: "greeter-service"
    namespace: "default"

  # 使用XDS解析器和负载均衡器
  client:
    greeter-service:
      resolver: "xds"
      balancer: "xds"
    external-service:
      resolver: "xds"
      balancer: "xds"

  # 配置XDS拦截器
  interceptor:
    unaryServer: ["logger", "xds"]
    streamServer: ["logger", "xds"]
    unaryClient: ["logger", "xds"]
    streamClient: ["logger", "xds"]

  # 启用统计和追踪
  stats:
    server: "otel"
    client: "otel"
    config:
      otel:
        receivedEvent: true
        sentEvent: true
        enableMetrics: true

  logger:
    level: "info"
    encoder: "json"

xds:
  management_server_addresses:
    - "istiod.istio-system:15010"

  node:
    id: "greeter-service-v1"
    cluster: "Kubernetes"
    metadata:
      app: "greeter"
      version: "v1"
      namespace: "default"

  xds_resources:
    ads: true
    listener_names: ["*"]
    route_config_names: ["*"]
    cluster_names: ["*"]

  security:
    tls_enabled: true
    ca_cert_file: "/var/run/secrets/istio/root-cert.pem"
    cert_file: "/var/run/secrets/istio/tls.crt"
    key_file: "/var/run/secrets/istio/tls.key"
    server_name: "istiod.istio-system"
    insecure_skip_verify: false

  backoff:
    base_interval: 500ms
    max_interval: 30s
    max_retries: 10

  initial_load_timeout: 15s

server:
  grpc:
    address: ":50051"
  rest:
    address: ":8080"

governor:
  address: ":8090"