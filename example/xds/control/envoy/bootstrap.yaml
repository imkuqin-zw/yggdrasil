node:
  # Envoy 节点标识，用于 Pilot 识别此代理
  id: "one.default.svc.cluster.local"
  cluster: "envoy-proxy"
  metadata:
    NAMESPACE: "default"
    WORKLOAD_NAME: "envoy"

# 动态资源配置 - 从 Pilot 获取
dynamic_resources:
  # Listener Discovery Service
  lds_config:
    ads: {}
    resource_api_version: V3
  
  # Cluster Discovery Service
  cds_config:
    ads: {}
    resource_api_version: V3
  
  # Aggregated Discovery Service - 统一的 xDS 配置源
  ads_config:
    api_type: GRPC
    transport_api_version: V3
    grpc_services:
      - envoy_grpc:
          cluster_name: xds-grpc

# 静态资源 - xDS 集群配置
static_resources:
  clusters:
    # xDS 服务器集群（连接到 Pilot）
    - name: xds-grpc
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: xds-grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: xds-control-plane  # 控制平面服务名
                      port_value: 15010
      # 健康检查
      health_checks:
        - timeout: 1s
          interval: 10s
          unhealthy_threshold: 2
          healthy_threshold: 1
          grpc_health_check: {}
      # 连接超时
      connect_timeout: 1s
      # 上游连接选项
      upstream_connection_options:
        tcp_keepalive:
          keepalive_time: 300

# 管理接口
admin:
  access_log_path: /dev/stdout
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

# 日志配置
layered_runtime:
  layers:
    - name: runtime-0
      rtds_layer:
        rtds_config:
          ads: {}
          resource_api_version: V3
        name: runtime-0
