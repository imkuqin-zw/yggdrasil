version: '3.8'

services:
  # xDS Control Plane (go-control-plane)
  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: xds-control-plane
    hostname: xds-control-plane
    ports:
      - "15010:15010"  # xDS gRPC
    networks:
      - xds-network
    environment:
      - LOG_LEVEL=debug

  # Envoy Proxy (数据平面)
  envoy:
    image: envoyproxy/envoy:${ENVOY_VERSION:-v1.28-latest}
    container_name: envoy-proxy
    hostname: envoy
    ports:
      - "${ENVOY_LISTENER_PORT:-10000}:10000"  # Application listener
      - "${ENVOY_ADMIN_PORT:-9901}:9901"       # Admin interface
    environment:
      - ENVOY_UID=0
      - loglevel=${ENVOY_LOG_LEVEL:-debug}
    volumes:
      - ./envoy/bootstrap.yaml:/etc/envoy/envoy.yaml
      - envoy-data:/var/lib/envoy
    networks:
      - xds-network
    depends_on:
      - control-plane
      - backend-service
    command:
      - -c
      - /etc/envoy/envoy.yaml
      - --service-cluster
      - envoy-proxy
      - --service-node
      - sidecar~10.0.0.1~envoy.default~default.svc.cluster.local

  # 后端服务示例
  backend-service:
    image: hashicorp/http-echo
    container_name: backend-service
    hostname: backend
    ports:
      - "${BACKEND_PORT:-8081}:5678"
    networks:
      - xds-network
    command:
      - -text="Hello from Backend Service"
      - -listen=:5678

  # 第二个后端服务实例（用于负载均衡测试）
  backend-service-2:
    image: hashicorp/http-echo
    container_name: backend-service-2
    hostname: backend-2
    ports:
      - "8082:5678"
    networks:
      - xds-network
    command:
      - -text="Hello from Backend Service 2"
      - -listen=:5678

networks:
  xds-network:
    driver: bridge
    # ipam:
    #   config:
    #     - subnet: 172.18.0.0/16

volumes:
  envoy-data:
