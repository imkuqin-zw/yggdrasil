# xDS Example Configuration for Server

yggdrasil:
  application:
    name: "example-service"
    version: "1.0.0"

  # Server configuration
  server:
    port: 8080

  # xDS configuration
  xds:
    server:
      address: "localhost:15010"
      useTLS: false
    
    node:
      cluster: "example-cluster"
      id: "example-service-instance-1"
      locality:
        region: "local"
        zone: "zone-1"
      buildVersion: "1.19.0"
    
    resources:
      lds: true
      rds: true
      cds: true
      eds: true
    
    timeout: 10s
    retryInterval: 5s
    maxRetries: 3
    useADS: true

  # Logging
  logger:
    level: "info"
